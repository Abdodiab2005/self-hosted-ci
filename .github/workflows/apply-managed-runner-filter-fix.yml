name: Apply managed runner filter fix

on:
  push:
    paths:
      - ".github/workflows/apply-managed-runner-filter-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch controller
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("server.js")
          source = path.read_text()

          queue_marker = '''async function handleQueued(
            payload,
          ) {'''

          helper_and_marker = '''function isManagedWorkflowJob(
            payload,
          ) {
            const labels =
              payload.workflow_job
                ?.labels;

            return (
              Array.isArray(labels) &&
              labels.includes(
                "self-hosted",
              ) &&
              labels.includes(
                RUNNER_LABEL,
              )
            );
          }

          async function handleQueued(
            payload,
          ) {'''

          if "function isManagedWorkflowJob(" not in source:
              if queue_marker not in source:
                  raise SystemExit("handleQueued marker not found")
              source = source.replace(queue_marker, helper_and_marker, 1)

          workflow_marker = '''async function handleWorkflowJob(
            payload,
          ) {
            switch (payload.action) {'''

          workflow_replacement = '''async function handleWorkflowJob(
            payload,
          ) {
            const job =
              payload.workflow_job;

            if (
              !isManagedWorkflowJob(
                payload,
              )
            ) {
              console.log(
                `[CI] Ignoring ${payload.action} ${payload.repository.full_name} job ${job?.id ?? "unknown"}. Labels=${JSON.stringify(job?.labels ?? [])}`,
              );

              return;
            }

            switch (payload.action) {'''

          if "[CI] Ignoring ${payload.action}" not in source:
              if workflow_marker not in source:
                  raise SystemExit("handleWorkflowJob marker not found")
              source = source.replace(workflow_marker, workflow_replacement, 1)

          path.write_text(source)
          PY

      - name: Syntax check
        run: node --check server.js

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          if git diff --cached --quiet; then
            echo "No server.js changes needed"
            exit 0
          fi
          git commit -m "Fix managed self-hosted runner filtering"
          git push
